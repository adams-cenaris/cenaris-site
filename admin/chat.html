<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat console — Cenaris</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/assets/favicon-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cenaris" />
<link rel="apple-touch-icon" href="/assets/favicon-icon.png" />
<link rel="stylesheet" href="/assets/site.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--neutral-50, #f8fafc); font-family: -apple-system, "Open Sauce One", "Segoe UI", system-ui, sans-serif; }

  /* Top bar */
  .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 20px; height: 52px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .topbar img { height: 24px; }
  .topbar h1 { font-size: 15px; font-weight: 600; color: #1a2b3c; margin: 0; flex: 1; }
  .topbar-avail { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .avail-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex-shrink: 0; }
  .avail-dot.on  { background: #22c55e; }
  .avail-dot.off { background: #f59e0b; }
  .btn-sm-outline { padding: 5px 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; color: #475569; transition: border-color .15s, color .15s; }
  .btn-sm-outline:hover { border-color: #4A9FCC; color: #4A9FCC; }
  .btn-logout { font-size: 12px; color: #94a3b8; background: none; border: none; cursor: pointer; padding: 4px 8px; }
  .btn-logout:hover { color: #475569; }

  /* Layout */
  .console { display: flex; flex: 1; min-height: 0; }

  /* Sidebar */
  .sidebar { width: 280px; border-right: 1px solid #e2e8f0; background: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h2 { font-size: 13px; font-weight: 600; margin: 0; color: #475569; text-transform: uppercase; letter-spacing: .04em; }
  .sidebar-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f1f5f9; transition: background .12s; }
  .conv-item:hover { background: #f8fafc; }
  .conv-item.active { background: #eff6ff; border-left: 3px solid #4A9FCC; }
  .conv-name { font-weight: 600; font-size: 13.5px; color: #1a2b3c; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-preview { font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .conv-time { font-size: 11px; color: #cbd5e1; }
  .conv-badge { background: #4A9FCC; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
  .conv-mode { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; padding: 1px 5px; border-radius: 4px; }
  .conv-mode.live { background: #dcfce7; color: #166534; }
  .conv-mode.ai   { background: #e0f2fe; color: #0369a1; }
  .empty-state { padding: 40px 20px; text-align: center; color: #94a3b8; font-size: 13px; }

  /* Chat area */
  .chat-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; }

  .chat-conv-header { padding: 12px 20px; border-bottom: 1px solid #e2e8f0; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .chat-conv-info h3 { margin: 0; font-size: 14px; }
  .chat-conv-info p  { margin: 2px 0 0; font-size: 12px; color: #64748b; }

  .chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; }
  .msg { max-width: 75%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; word-wrap: break-word; }
  .msg.visitor { align-self: flex-end; background: #4A9FCC; color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent   { align-self: flex-start; background: #fff; color: #1a2b3c; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
  .msg.ai      { align-self: flex-start; background: #eff6ff; color: #1a2b3c; border-bottom-left-radius: 4px; }
  .msg.system  { align-self: center; background: #f1f5f9; color: #64748b; font-size: 12px; border-radius: 8px; text-align: center; max-width: 90%; }
  .msg-meta { font-size: 11px; opacity: .5; margin-top: 3px; }

  .chat-input-area { padding: 12px 16px; border-top: 1px solid #e2e8f0; background: #fff; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  .chat-input { flex: 1; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 12px; font-size: 14px; resize: none; font-family: inherit; outline: none; max-height: 120px; overflow-y: auto; transition: border-color .15s; }
  .chat-input:focus { border-color: #4A9FCC; }
  .chat-send { padding: 9px 18px; background: #4A9FCC; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; flex-shrink: 0; font-family: inherit; }
  .chat-send:hover { background: #3a8ab8; }
  .chat-send:disabled { background: #cbd5e1; cursor: not-allowed; }
  .close-conv-btn { padding: 5px 12px; border: 1px solid #fca5a5; color: #ef4444; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: background .15s; }
  .close-conv-btn:hover { background: #fef2f2; }

  @media (max-width: 640px) {
    /* Sidebar goes full-width on mobile; chat area is hidden until a conv is tapped */
    .sidebar { width: 100%; border-right: none; }
    .mobile-back-btn { display: inline-block !important; }
    /* Compact topbar: hide heading and availability text to save space */
    .topbar h1 { display: none; }
    #avail-label { display: none; }
    .topbar { gap: 8px; padding: 0 10px; }
    /* Notification area: hide test button on mobile to save topbar space */
    #notif-test-btn { display: none !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="/assets/logo-horizontal.png" alt="Cenaris" />
  <h1>Chat console</h1>
  <div class="topbar-avail">
    <div class="avail-dot" id="avail-dot"></div>
    <span id="avail-label">Checking…</span>
    <button class="btn-sm-outline" id="avail-toggle">Go online</button>
  </div>
  <div id="notif-area" style="display:flex;align-items:center;gap:6px">
    <button class="btn-sm-outline" id="notif-test-btn" style="font-size:11px;padding:4px 9px" title="Send a test push to your phone via ntfy">Test notify</button>
  </div>
  <button class="btn-logout" id="logout-btn">Sign out</button>
</div>

<div class="console">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Open conversations</h2>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="empty-state">No active conversations</div>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="chat-empty" id="chat-empty">Select a conversation to view it</div>
    <div id="chat-conv" style="display:none; flex-direction:column; flex:1; min-height:0;">
      <div class="chat-conv-header">
        <button class="btn-sm-outline mobile-back-btn" id="mobile-back-btn" style="display:none;flex-shrink:0">← Back</button>
        <div class="chat-conv-info" style="flex:1;min-width:0">
          <h3 id="conv-name">Visitor</h3>
          <p id="conv-detail"></p>
        </div>
        <button class="close-conv-btn" id="close-conv-btn">Close</button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chat-input" placeholder="Type a reply…" rows="1"></textarea>
        <button class="chat-send" id="chat-send">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="/assets/admin-chat.js" defer></script>
</body>
</html>
